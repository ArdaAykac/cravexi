<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İletişim - Cravexi</title>
<meta name="description" content="Cravexi ile iletişime geçin. Projeler ve hizmetler hakkında bilgi alın.">
<meta name="keywords" content="Cravexi, iletişim, e-posta, yazılım">
<meta name="author" content="Arda Aykaç">
<meta name="robots" content="index, follow">

<style>
body, html {
    font-family:'Arial', sans-serif;
    background:#000;
    color:#fff;
    margin:0;
    padding:0;
    scroll-behavior:smooth;
    line-height:1.6;
}

/* Header */
header {
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background: rgba(0,0,0,0.8);
    position:fixed;
    width:100%;
    top:0;
    z-index:100;
}
header .logo {
    font-size:28px;
    font-weight:bold;
    background: linear-gradient(45deg,#ff9900,#ffcc00);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    cursor:pointer;
    text-decoration:none;
    margin-bottom:5px;
}
nav {
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
}
nav a {
    color:#fff;
    text-decoration:none;
    margin-left:25px;
    font-weight:500;
    white-space: nowrap;
}
nav a:hover { color:#ff9900; }

/* Ana içerik */
main {
    padding:140px 20px 60px 20px;
    max-width:800px;
    margin:auto;
    text-align:center;
}
h2 {
    font-size:36px;
    margin-bottom:30px;
    background: linear-gradient(45deg,#ff9900,#ffcc00);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}
p {
    font-size:20px;
    color:#ddd;
    margin-bottom:20px;
}
.email {
    font-size:22px;
    color:#ff9900;
    font-weight:bold;
    margin-bottom:30px;
}
.email a {
    color:#ff9900;
    text-decoration:none;
}
@media(max-width:768px){
header { flex-direction:column; align-items:flex-start; padding:15px 20px; }
nav { justify-content:flex-start; margin-top:10px; }
nav a { margin:5px 15px 0 0; }
h2 { font-size:28px; }
p { font-size:18px; }
.email { font-size:18px; }
}
</style>
</head>
<body>

<header>
<a class="logo" href="base.html">Cravexi</a>
<nav>
</nav>
</header>

<main>
<h2>Bize Ulaşın</h2>
<p class="email">E-posta: <a href="mailto:cravexi.studio@gmail.com">cravexi.studio@gmail.com</a></p>
<p>Projelerimiz ve hizmetlerimiz hakkında daha fazla bilgi almak için bizimle iletişime geçebilirsiniz.</p>
</main>

</body>
</html>
